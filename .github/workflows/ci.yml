name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsx --test packages/engines/src/**/*.test.ts
      - run: npx tsx --test packages/cli/src/**/*.test.ts
      - run: npm run build
